dialog_file_exists_title=出力ファイルの重複 (File Exists)
dialog_file_exists_message=出力ファイルの一部が既に存在します。どうしますか？\n・「最初からやり直す」: 既存のファイルを上書きして最初からエンコードします。\n・「前回の続きから再開」: 既に作成済みのパートをスキップし、残りの処理から再開します。\n・「別名で保存」: 既存のファイルは残し、コピーとして別名で保存します。\n\n(Output file already exists. Overwrite, Resume, or Save as Copy?)
option_overwrite_all=最初からやり直す (Overwrite)
option_resume_all=前回の続きから再開 (Resume)
option_save_as_copy=別名で保存 (Save as Copy)
dialog_cache_detected_title=エンコードキャッシュの検出 (Cache Detected)
dialog_cache_detected_message=前回のエンコード中の一時キャッシュ（一時ファイル）が検出されました。どうしますか？\n・「最初からやり直す」: 既存のキャッシュを破棄して、最初からエンコードします。\n・「前回の続きから再開」: キャッシュを利用し、中断した位置からエンコードを再開します。\n\n(Temporary encoding cache detected. Overwrite or Resume?)